<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>File Transfer Server</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #007acc;
            --danger-color: #d13438;
            --success-color: #107c10;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            overflow: auto;
            border-radius: 10px;
            user-select: none;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            -webkit-app-region: drag; /* Allows window to be dragged by header */
        }
        .title {
            font-size: 18px;
            font-weight: 600;
        }
        .close-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 20px;
            cursor: pointer;
            -webkit-app-region: no-drag;
        }
        .close-btn:hover {
            color: white;
        }
        
        .card {
            background-color: #2d2d2d;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--success-color);
        }
        .hostname-label {
            font-size: 14px;
            color: #aaa;
            margin-top: 5px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }
        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #555;
            transition: .4s;
            border-radius: 20px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: var(--accent-color);
        }
        input:checked + .slider:before {
            transform: translateX(20px);
        }

        .dir-path {
            font-family: monospace;
            font-size: 12px;
            color: #aaa;
            background: #1e1e1e;
            padding: 8px;
            border-radius: 4px;
            word-break: break-all;
            margin: 10px 0;
        }
        button.btn {
            background-color: #3e3e42;
            color: white;
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            transition: 0.2s;
        }
        button.btn:hover {
            background-color: #4e4e52;
        }
        .quit-btn {
            margin-top: 20px;
            background-color: var(--danger-color) !important;
            border-color: var(--danger-color) !important;
        }
        .quit-btn:hover {
            background-color: #e81123 !important;
        }
        .hint {
            font-size: 12px;
            color: #888;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div id="qrModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; flex-direction: column;">
        <div style="background: white; padding: 20px; border-radius: 8px; text-align: center;">
            <img id="qrImage" src="" alt="QR Code" style="width: 200px; height: 200px; object-fit: contain; margin-bottom: 10px;">
            <div style="color: black; font-weight: bold;">Scan to connect to Hotspot</div>
        </div>
        <button class="btn" id="closeQRBtn" style="width: 240px; margin-top: 20px;">Close</button>
    </div>
    <div class="header">
        <div class="title">File Transfer Server</div>
        <div style="display: flex; gap: 10px;">
            <button class="close-btn" id="minimizeBtn" title="Minimize to Taskbar">&minus;</button>
            <button class="close-btn" id="hideBtn" title="Close to Taskbar">&times;</button>
        </div>
    </div>

    <div class="card">
        <div class="status-row">
            <span>Server Status</span>
            <div class="status-indicator">
                <div class="dot"></div>
                <span>Online</span>
            </div>
        </div>
        <div class="hostname-label" id="hostnameLabel" style="margin-bottom: 5px;">Hostname: Loading...</div>
        <div class="status-row" style="margin-top: 10px; margin-bottom: 0;">
            <span style="font-size: 14px; color: #aaa;">Token:</span>
            <div style="display: flex; gap: 5px; align-items: center;">
                <span id="tokenLabel" style="font-family: monospace; font-size: 14px;">Loading...</span>
                <button id="copyTokenBtn" style="background: none; border: none; cursor: pointer; color: var(--accent-color); font-size: 14px;" title="Copy Token">📋</button>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="status-row">
            <span>Mobile Hotspot</span>
            <label class="switch">
                <input type="checkbox" id="hotspotToggle">
                <span class="slider"></span>
            </label>
        </div>
        <button class="btn" id="showQRBtn" style="margin-top: 5px; display: none;">Show Hotspot QR Code</button>
    </div>

    <div class="card">
        <div>Save Location</div>
        <div class="dir-path" id="dirPath">/default/uploads/path</div>
        <button class="btn" id="changeDirBtn">Change Folder</button>
    </div>

    <div class="card">
        <div class="status-row">
            <span>Save text to file</span>
            <input type="checkbox" id="saveToFileCheckbox" style="cursor: pointer; width: 16px; height: 16px;">
        </div>
        <div class="status-row" style="margin-bottom: 0;">
            <span>Copy to clipboard</span>
            <input type="checkbox" id="copyToClipboardCheckbox" checked style="cursor: pointer; width: 16px; height: 16px;">
        </div>
    </div>

    <div class="card">
        <div style="font-weight: bold; margin-bottom: 10px;">Send to iPhone</div>
        <textarea id="sendTextInput" placeholder="Enter text here..." style="width: 100%; height: 60px; background: #1e1e1e; color: white; border: 1px solid #555; border-radius: 4px; padding: 8px; box-sizing: border-box; margin-bottom: 10px; resize: vertical; font-family: inherit;"></textarea>
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
            <button class="btn" id="sendFileBtn">Select File</button>
            <button class="btn" id="queueForIphoneBtn" style="background-color: var(--accent-color); border-color: var(--accent-color);">Queue for iPhone</button>
        </div>
        <div id="queueStatus" style="font-size: 12px; color: #aaa;">Nothing queued.</div>
    </div>

    <button class="btn quit-btn" id="quitBtn">Quit Application</button>
    <div class="hint">Press Ctrl+Alt+S to hide/show</div>
    
    <div class="card" id="lastReceivedCard" style="display: none; margin-top: 15px;">
        <div style="font-size: 13px; margin-bottom: 5px;">Last Received (<span id="lastReceivedTime"></span>)</div>
        <div class="dir-path" id="lastReceivedContent" style="color: #fff; max-height: 80px; overflow-y: auto;"></div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
